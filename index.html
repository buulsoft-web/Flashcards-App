<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rebecca's Flashcards</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF6B5B">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Flashcards">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>(function(){var d=document.documentElement,s,k;try{s=localStorage.getItem('rebecca.flashcards.theme.v1');k=localStorage.getItem('rebecca.flashcards.skin.v1')}catch(e){}d.dataset.skin=/^(original|sticker|wallet|postcard)$/.test(k)?k:'sticker';d.dataset.theme=s==='light'||s==='dark'?s:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'})()</script>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--card:#fff;--line:#e2e0d8;--acc:#c8102e;--mut:#6b6a63;color-scheme:light}
:root[data-theme=dark]{--bg:#161616;--fg:#f2f1ec;--card:#222;--line:#383836;--mut:#a09f98;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:6px 8px}
h1{font-size:22.5px;margin:0;cursor:pointer}
.hd{display:flex;flex-direction:column;align-items:stretch;gap:5px;margin:0 0 6px}
.hd button{padding:4px 4px;font-size:13px;white-space:nowrap;flex:1 1 0;min-width:0}
.hd h1{min-width:0;line-height:1.25;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 8px}
#byline{font-size:18px;color:var(--mut);font-weight:400;white-space:nowrap;flex:0 0 auto;margin-left:auto}
#ver{margin-left:auto;padding-left:4px;align-self:center;font-size:11px;color:var(--mut);white-space:nowrap;flex:0 0 auto}
.hd>div{display:flex;flex-wrap:nowrap;gap:5px;align-items:stretch}
.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.form #en{flex:1 1 0;min-width:0}
.form #cat{flex:0 0 36%;width:36%}
.form .save{padding:6px 14px}
#save{background:#d6d5cf;color:#6b6a63;font-weight:600;transition:background .15s,color .15s}
#save.on{background:#4b4b47;color:#fff}
.swh{font-size:12px;font-style:italic;color:var(--mut);white-space:nowrap;text-align:right}
.form #newcat{flex:1 1 100%}
input,select{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer}
.save{background:var(--acc);color:#fff;border:0;font-weight:600;padding:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px;padding-bottom:2px}
.chips button{white-space:nowrap;border-radius:99px;padding:3px 10px;font-size:13px}
.chips button.sel{box-shadow:0 0 0 2px var(--fg);font-weight:600}
.chips button.all.sel{background:var(--fg);color:var(--bg)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 20px 6px 8px;position:relative;cursor:pointer;color:#1d1d1b;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card .en{font-size:16px;line-height:1.25;font-weight:500}
.card .zh{font-size:11px;line-height:1.3;color:#55544d;margin-top:2px}
.empty{color:var(--mut);text-align:center;padding:24px;grid-column:1/-1}
#view,#lpv{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:calc(8px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom));z-index:9;overscroll-behavior:none}
#vbody,#lpbody{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;touch-action:none}
#view.open,#lpv.open{display:flex}
#vzh,#ven,#lpzh,#lpen{cursor:pointer;-webkit-tap-highlight-color:transparent}
#vzh:active,#ven:active,#lpzh:active,#lpen:active{opacity:.55}
#vzh,#lpzh{font-size:min(21vw,150px);line-height:1.2;font-weight:600;max-width:100%;overflow-wrap:anywhere}
#ven,#lpen{font-size:min(7.5vw,40px);line-height:1.25;color:var(--mut);margin-top:18px;max-width:100%}
.top{width:100%;text-align:left}
.tl{flex:1;min-width:0}
.tr{display:flex;gap:8px;margin-top:10px}
.tr button{flex:1 1 0;min-width:0;font-size:18px;line-height:1.2;padding:10px 6px;white-space:nowrap;min-height:88px}
.vh{font-size:12px;margin-left:6px}
#cnt{color:var(--mut);font-size:14px;padding-left:4px}
#vchips{margin-top:8px}
#vchips button{font-size:15px;padding:5px 12px}
#splash{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:20;cursor:pointer}
#splash.open{display:flex}
.sw{position:relative;width:min(100vw,calc(100vh*.803));aspect-ratio:640/797;container-type:inline-size}
.sw img{width:100%;height:100%;display:block}
.bt{position:absolute;left:59.5%;top:61%;width:36%;height:13.5%;transform:rotate(-2deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f3d58a;font:700 4.8cqw/1.2 Georgia,serif;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bt small{font-size:3.6cqw;font-weight:600;opacity:.9}
.card.drag{position:relative;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:.92;transition:none}
.card.tb{box-shadow:-4px 0 0 var(--acc)}.card.ta{box-shadow:4px 0 0 var(--acc)}
#tst{font-size:11px;color:var(--mut);margin:0 0 4px}
#tst:empty,#catbar:empty{display:none}
.chiprow{display:flex;align-items:flex-start;gap:6px}
.chiprow #chips{flex:1 1 auto;min-width:0}
#catside{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin:6px 0 2px}
#catbar{margin:0}
.cdel{font-size:13px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.ed{position:absolute;top:0;right:0;border:0;background:none;color:#55544d;padding:3px 7px;font-size:14px}
.ci{position:relative;text-align:center;margin-bottom:4px;pointer-events:none}
.cimg{height:58px;width:auto;max-width:100%;object-fit:contain;-webkit-user-drag:none}
.clg{position:absolute;right:calc(50% - 46px);bottom:-2px;height:22px;width:auto;max-width:44px;object-fit:contain;background:#fff;border-radius:5px;padding:1px}
.cic{height:16px;width:auto;max-width:34px;object-fit:contain;vertical-align:-3px;margin-right:4px;background:#fff;border-radius:4px;padding:1px;pointer-events:none}
#vimg{position:relative;display:none;margin-bottom:14px}
#vimg.on{display:inline-block}
#vimg .cimg{height:24vh;width:auto;max-width:70vw}
#vimg .clg{height:auto;width:30%;max-width:90px;right:-14px;bottom:-6px;padding:3px;border-radius:8px}
.pr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pr img{height:48px;max-width:90px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;vertical-align:middle}
.pr em{font-size:12px;color:var(--mut)}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.pc{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid var(--line)}
.pc.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
#dlg.open{display:flex}
#dbox{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;max-width:420px;display:grid;gap:8px;max-height:100%;overflow:auto;text-align:left}
#dbox h3{margin:0;font-size:16px}
#dbox label{font-size:12px;color:var(--mut)}
#dbox .pv{font-size:15px}#dbox .pv small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
#dbox .btns{display:grid;gap:6px;margin-top:4px}
#dbox .btns .save{padding:10px 14px}
#dbox ul{margin:0;padding-left:18px;font-size:14px;line-height:1.45}
#dbox h4{margin:6px 0 0;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
#dbox .btns .dng{color:var(--acc);border-color:var(--acc)}
.tabs{display:flex;gap:6px;position:sticky;top:-14px;background:var(--card);padding:6px 0;z-index:2}
.tabs button{flex:1}.tabs button.sel{background:var(--fg);color:var(--bg);font-weight:600}
#dbox .ex{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;justify-items:start}
#dbox .ex .card{cursor:default;width:190px;max-width:100%}
#dbox .ex small{color:var(--mut);font-size:12px;line-height:1.4}
#dbox .ex .pc{cursor:default}
.posrow{display:flex;align-items:center;gap:8px}
.posrow input{flex:0 0 76px;text-align:center}
.posrow button{flex:0 0 auto;padding:8px 18px}
.posrow button:disabled{opacity:.35;cursor:default}
.posrow span{color:var(--mut);font-size:14px}
.dm{position:absolute;left:5%;top:2%;width:90%;box-sizing:border-box;background:rgba(255,255,255,.9);border-radius:3cqw;padding:2cqw;box-shadow:0 2cqw 6cqw rgba(0,0,0,.35);opacity:0;transform:translateY(-3cqw);transition:opacity .4s,transform .4s;color:#1d1d1b;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;pointer-events:none}
.dm.on{opacity:1;transform:none}
.dmtop{display:flex;gap:2cqw;align-items:stretch}
.dmleft{flex:0 0 50%;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1.2cqw}
.dmin,.dmsel{box-sizing:border-box;width:100%;flex:0 0 auto;background:#fff;border:.4cqw solid #c9c7bf;border-radius:1.4cqw;padding:.9cqw 1.8cqw;font-size:3.2cqw;line-height:1.2;min-height:6cqw;white-space:nowrap;overflow:hidden}
.dmin{border-color:#c8102e}
.dmsel{display:flex;justify-content:space-between;color:#8a897f;transition:.3s}
.dmsel.hl{color:#1d1d1b;border-color:#c8102e;font-weight:600}
.dmcur{display:inline-block;width:.4cqw;height:3.2cqw;background:#c8102e;vertical-align:-.5cqw;margin-left:.3cqw;animation:dmblink .8s steps(1) infinite}
@keyframes dmblink{50%{opacity:0}}
.dmsave{background:#4b4b47;color:#fff;font-weight:600;font-size:3.2cqw;line-height:1.2;border-radius:1.4cqw;padding:1.1cqw 4cqw;opacity:0;transform:scale(.8);transform-origin:left center;transition:.25s}
.dmsave.on{opacity:1;transform:none}
.dmsave.press{transform:scale(.88)}
.dmcard{position:relative;z-index:2;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-radius:1.8cqw;padding:1.6cqw 2cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.3);border:.3cqw solid rgba(0,0,0,.2)}
.dmcard b{display:block;font-size:3.4cqw;line-height:1.25;min-height:4.3cqw}
.dmcard small{display:block;font-size:4.6cqw;font-weight:700;line-height:1.2;margin-top:1cqw;min-height:5.6cqw;color:#1d1d1b}
.dmst{display:flex;justify-content:space-around;margin-top:2cqw}
.stk{width:24cqw;text-align:center;font-size:2.8cqw;font-weight:700}
.pile{position:relative;height:7cqw;width:16cqw;margin:0 auto 1.2cqw}
.pile .pc{position:absolute;inset:0;width:auto;height:auto;padding:0;border-radius:1.4cqw;border:.3cqw solid rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1d1d1b}
.pile .pc:nth-child(1){transform:translate(-1cqw,1.1cqw) rotate(-5deg)}
.pile .pc:nth-child(2){transform:translate(.9cqw,.5cqw) rotate(3deg)}
.pz{font-size:4.6cqw;font-weight:700;line-height:1}
.plg{height:3.8cqw;width:auto}
.pw{font-size:1.7cqw;font-weight:800;letter-spacing:.25cqw;line-height:1.2}
.stk.bump .pile{animation:dmbump .55s}
@keyframes dmbump{40%{transform:scale(1.18)}}

html{background:var(--bg)}
.hd{margin:0 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.hd h1{flex-wrap:nowrap;gap:0 6px;font-size:clamp(14px,5vw,24px)}
#appname{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#byline{font-size:clamp(10px,3.3vw,17px)}
html.composing[data-skin=sticker] body{position:fixed;left:0;right:0;top:0;overflow:hidden}
html.composing[data-skin=sticker] main{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
html.composing[data-skin=sticker] .hd{position:sticky;top:0;z-index:4;background:var(--bg);padding-top:6px}
html.composing[data-skin=sticker] .form{position:absolute;bottom:12px}
@media(max-width:350px){#ver{display:none}}
.skopt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:8px;border-radius:12px}
.skopt.sel{outline:2px solid var(--acc);outline-offset:-2px}
.skopt *{pointer-events:none}
.skopt b{display:block;font-weight:600}
.skopt small{display:block;color:var(--mut);font-size:12px;line-height:1.3;margin-top:2px}
.skpv{flex:0 0 74px;height:58px;border-radius:8px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.15)}
.skpv i{position:absolute;display:block}

/* ===== Theme: Sticker pop ===== */
:root[data-skin=sticker]{--bg:#FFF4DA;--fg:#2b2540;--card:#fff;--line:#2b2540;--acc:#FF6B5B;--mut:#7a6a8a;--ol:#2b2540;--sh:#2b2540}
:root[data-skin=sticker][data-theme=dark]{--bg:#221d33;--fg:#f5eefc;--card:#2f2945;--line:#8f84b8;--acc:#ff8a7a;--mut:#b9afd0;--ol:#2b2540;--sh:#0d0a18}
[data-skin=sticker] main{padding-bottom:110px}
[data-skin=sticker] h1{font-weight:600}
[data-skin=sticker] .hd button{font-size:12px;padding:4px 2px;border:2px solid var(--fg);border-radius:99px;background:var(--card);color:var(--fg)}
[data-skin=sticker] .form{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;z-index:6;background:var(--card);border:2px solid var(--ol);border-radius:30px;box-shadow:3px 3px 0 var(--sh);padding:6px 6px 6px 14px}
[data-skin=sticker][data-theme=dark] .form{border-color:var(--fg)}
[data-skin=sticker] .form input,[data-skin=sticker] .form select{background:transparent;border:0}
[data-skin=sticker] .form #cat{background:#FFE48A;color:#2b2540;border:2px solid var(--ol);border-radius:99px;padding:6px 8px}
[data-skin=sticker] #save{background:#d9d4e6;color:#8a8499;border:2px solid var(--ol);border-radius:99px;padding:8px 12px}
[data-skin=sticker] .form #cat{flex:0 0 32%;width:32%}
[data-skin=sticker] #save.on{background:var(--acc);color:#fff}
[data-skin=sticker] .chips button{border:2px solid var(--ol);color:#2b2540}
[data-skin=sticker] .chips button.all{background:var(--card);color:var(--fg);border-color:var(--fg)}
[data-skin=sticker] #list{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;padding:8px 6px 36px}
[data-skin=sticker] #list .card{border:2px solid var(--ol);border-radius:16px;box-shadow:3px 3px 0 var(--sh);margin-bottom:-12px;padding:8px 22px 8px 10px}
[data-skin=sticker] #list .card:nth-child(4n+1){transform:rotate(-2.5deg)}
[data-skin=sticker] #list .card:nth-child(4n+2){transform:rotate(2deg);margin-top:18px}
[data-skin=sticker] #list .card:nth-child(4n+3){transform:rotate(1.5deg)}
[data-skin=sticker] #list .card:nth-child(4n){transform:rotate(-2deg);margin-top:18px}
[data-skin=sticker] #list .card .en{font-weight:600}
[data-skin=sticker] #dbox{border:2px solid var(--fg);border-radius:18px;box-shadow:4px 4px 0 var(--sh)}

/* ===== Theme: Soft wallet ===== */
:root[data-skin=wallet]{--bg:#EEE9FF;--fg:#26215C;--card:#fff;--line:#d9d2f5;--acc:#7F77DD;--mut:#6a639c}
:root[data-skin=wallet][data-theme=dark]{--bg:#1d1a2e;--fg:#ece9ff;--card:#2a2640;--line:#3d3860;--acc:#9d96ee;--mut:#a9a3d6}
[data-skin=wallet] h1{font-weight:600}
[data-skin=wallet] .hd button{border:0;background:rgba(127,119,221,.16);color:var(--fg);border-radius:99px}
[data-skin=wallet] .form{border:0;border-radius:24px;padding:7px 7px 7px 14px}
[data-skin=wallet] .form input,[data-skin=wallet] .form select{background:transparent;border:0}
[data-skin=wallet] .form #cat{background:#CDEFE0;color:#085041;border-radius:99px;padding:6px 8px}
[data-skin=wallet] #save{background:var(--line);color:var(--mut);border-radius:99px;padding:8px 16px}
[data-skin=wallet] #save.on{background:var(--acc);color:#fff}
[data-skin=wallet] .chips button{border:0;color:#1d1d1b}
[data-skin=wallet] .chips button.all{background:var(--card);color:var(--fg)}
[data-skin=wallet] #list{display:flex;flex-direction:column;gap:0;padding:6px 0 40px}
[data-skin=wallet] #list .card{display:flex;flex-wrap:nowrap;align-items:flex-start;justify-content:space-between;gap:0 12px;min-height:132px;margin-top:-72px;padding:12px 26px 12px 18px;border:2px solid var(--bg);border-radius:24px}
[data-skin=wallet] #list .card:first-child{margin-top:0}
[data-skin=wallet] #list .card:last-child{min-height:150px}
[data-skin=wallet] #list .card .ci{order:-1;flex:0 0 auto;margin:0 -2px 0 0}
[data-skin=wallet] #list .card .cimg{height:34px}
[data-skin=wallet] #list .card:last-child .cimg{height:70px}
[data-skin=wallet] #list .card .en{flex:1 1 0;min-width:0;font-size:16px;font-weight:600}
[data-skin=wallet] #list .card .zh{flex:0 1 38%;min-width:0;text-align:right;font-size:17px;margin-top:0}
[data-skin=wallet] #list .card:not(:last-child) .en,[data-skin=wallet] #list .card:not(:last-child) .zh{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
[data-skin=wallet] #list .card .ed{top:3px;right:5px}

/* ===== Theme: Postcards ===== */
:root[data-skin=postcard]{--bg:#F6EFE3;--fg:#3b2f1e;--card:#FFFDF8;--line:#d9ccb3;--acc:#C8102E;--mut:#8a7650}
:root[data-skin=postcard][data-theme=dark]{--bg:#1f1a14;--fg:#efe6d6;--card:#2a241b;--line:#4a4132;--acc:#e0485f;--mut:#b6a688}
[data-skin=postcard] h1,[data-skin=postcard] .swh,[data-skin=postcard] #ven{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}
[data-skin=postcard] #byline{font-style:italic}
[data-skin=postcard] .logo{display:none}
[data-skin=postcard] #appname::before{content:'卡';display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-size:14px;margin-right:6px;transform:rotate(-8deg);vertical-align:middle}
[data-skin=postcard] .hd button{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--fg)}
[data-skin=postcard] .form{border:1.5px dashed #b9a98a;border-radius:6px}
[data-skin=postcard] .form input,[data-skin=postcard] .form select{background:transparent;border:0;font-family:Georgia,"Songti SC",serif}
[data-skin=postcard] #en::placeholder{font-style:italic}
[data-skin=postcard] .form #cat{background:#CDEFE0;color:#085041;border-radius:3px 10px 10px 3px;padding:6px 8px}
[data-skin=postcard] #save{background:#c9bfae;color:#fff;border:1.5px dashed var(--bg);outline:1.5px solid #c9bfae;border-radius:2px;padding:6px 14px;margin:2px}
[data-skin=postcard] #save.on{background:var(--acc);outline-color:var(--acc)}
[data-skin=postcard] .chips button{border:1px solid #b9a98a;color:#1d1d1b}
[data-skin=postcard] .chips button.all{background:var(--card);color:var(--fg)}
[data-skin=postcard] #list{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;padding:12px 8px 40px}
[data-skin=postcard] #list .card{background:#fff!important;border:.5px solid #d9ccb3;border-radius:2px;padding:6px 6px 8px;margin-bottom:-10px}
[data-skin=postcard] #list .card:nth-child(4n+1){transform:rotate(-3deg)}
[data-skin=postcard] #list .card:nth-child(4n+2){transform:rotate(2.5deg);margin-top:14px}
[data-skin=postcard] #list .card:nth-child(4n+3){transform:rotate(1.5deg)}
[data-skin=postcard] #list .card:nth-child(4n){transform:rotate(-2.5deg);margin-top:14px}
[data-skin=postcard] #list .card::before{content:'';display:block;height:26px;background:var(--cc,#eee);margin-bottom:6px}
[data-skin=postcard] #list .card.hp::before{display:none}
[data-skin=postcard] #list .card::after{content:'';position:absolute;top:-7px;left:50%;width:44px;height:14px;margin-left:-22px;background:var(--cc,#eee);opacity:.85;transform:rotate(-3deg);filter:saturate(1.6) brightness(.95)}
[data-skin=postcard] #list .card .ci{height:68px;background:var(--cc,#eee);display:flex;align-items:center;justify-content:center;margin:0 0 6px}
[data-skin=postcard] #list .card .cimg{height:56px}
[data-skin=postcard] #list .card .clg{right:6px;bottom:2px}
[data-skin=postcard] #list .card .en{font-family:Georgia,"Songti SC",serif;font-size:14px;font-weight:600}
[data-skin=postcard] #list .card .ed{top:2px;right:2px;background:rgba(255,255,255,.75);border-radius:50%;padding:1px 4px;z-index:2}
/* ===== Library ===== */
.chips button.lib,[data-skin] .chips button.lib{background:transparent;border:2px dashed var(--mut);color:var(--fg);font-weight:600}
#dbox .skopt .libtile{display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:#fde2e4;color:#1d1d1b}
#dbox input[type=checkbox]{flex:0 0 auto;width:22px;height:22px;padding:0;margin:0;accent-color:var(--acc)}
#dbox .lsearch{display:flex;gap:6px;margin:6px 0 2px}
#dbox .lsearch input{flex:1;font-size:16px}
#dbox .lsearch input::-webkit-search-cancel-button,#dbox .lsearch input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
#dbox .lsearch button{padding:6px 12px}
#dbox .lsearch button[hidden]{display:none}
#dbox .lres{font-size:13px;color:var(--mut);text-align:center;margin:6px 0 4px;min-height:16px}
#dbox .lnone{text-align:center;color:var(--mut);padding:18px 8px}
#dbox .lsizes{display:flex;gap:6px;margin:6px 0 4px}
#dbox .lsz{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:12px;font-size:15px;line-height:1.2}
#dbox .lsz small{font-size:12px;color:var(--mut)}
#dbox .lsz *{pointer-events:none}
#dbox .lsz.sel{background:var(--fg);color:var(--bg)}
#dbox .lsz.sel small{color:var(--bg);opacity:.8}
#dbox .lbar{display:flex;flex-wrap:wrap;gap:6px}
#dbox .lbar button{flex:1 1 auto;padding:6px 8px;font-size:13px;white-space:nowrap}
#dbox .lcat{display:flex;align-items:center;gap:8px;margin-top:4px;padding:0 8px 0 10px;border-radius:10px;color:#1d1d1b}
#dbox .lcat input{background:#fff}
#dbox .lhd{flex:1;display:flex;align-items:center;gap:8px;min-width:0;background:transparent;border:0;padding:5px 0;color:#1d1d1b;text-align:left;font-size:14px}
#dbox .lhd *{pointer-events:none}
#dbox .lhd b{flex:1;font-size:14px}
#dbox .lhd small{font-size:12px;color:#55544d;white-space:nowrap}
#dbox .chev{font-style:normal;font-size:14px;width:16px;text-align:center}
#dbox .lnote{font-size:12px;color:var(--mut);padding:2px 4px}
#dbox .lrow{display:flex;align-items:center;border-bottom:1px solid rgba(127,127,127,.28)}
#dbox .lsel{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:15px;color:var(--fg);cursor:pointer}
#dbox .len{flex:1 1 0;min-width:0}
#dbox .len b{display:block;font-size:20px;font-weight:500;line-height:1.15}
#dbox .len em{display:block;font-style:normal;font-size:12px;color:var(--mut)}
#dbox .lzh{flex:0 1 auto;max-width:42%;min-width:0;text-align:right;font-size:14px;line-height:1.3;color:var(--fg);opacity:.72}
#dbox .lrow.have .lsel{opacity:.55;cursor:default}
#dbox .lpvb{flex:0 0 auto;width:30px;height:30px;padding:0;margin:0 0 0 4px;border-radius:50%;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
#dbox .lfoot{position:sticky;bottom:-14px;background:var(--card);margin:0;padding:8px 0 0;border-top:1px solid var(--line);z-index:2}
#dbox .lmsg{font-size:13px;text-align:center}
#dbox .lmsg:empty{display:none}
#dbox .btns .save:disabled{opacity:.4;cursor:default}
#lpv{z-index:40}
#lpcnt{color:var(--mut);font-size:14px;padding-left:4px}
#lpcat{padding:3px 14px;border-radius:99px;border:2px solid var(--line);font-size:13px;font-weight:600;color:#1d1d1b;margin-bottom:14px}
</style></head><body>

<script>
const APP={name:"Rebecca's Flashcards",ver:"5.0"};
const NS='rebecca.flashcards.';
const KEY=NS+'v1',CKEY=NS+'colors.v1',IKEY=NS+'icons.v1',OKEY=NS+'order.v1',TKEY=NS+'theme.v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Data (everything is kept in localStorage on this device) ----------
const SEED=[
 {en:"Where is the Bacardi?",zh:"百加得在哪里？",cat:"Drinks"},
 {en:"Where is a weird Dutch guy?",zh:"那个奇怪的荷兰人在哪里？",cat:"People"},
 {en:"Please make a photo.",zh:"请帮我拍张照片。",cat:"Daily life"},
 {en:"Where is the bus station?",zh:"汽车站在哪里？",cat:"Travel"}];
const PAL=['#fde2e4','#fff1c9','#e2f0cb','#cdeedd','#d6e6f7','#e4dcf5','#fbd9ec','#ffe0cc','#d9f0f0','#ece5d8'];
const read=(k,ok,d)=>{try{const v=JSON.parse(localStorage.getItem(k));if(ok(v))return v}catch(e){}return d};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const isHex=v=>typeof v==='string'&&/^#[0-9a-f]{3,8}$/i.test(v);
let cards=read(KEY,Array.isArray,null)||SEED.map((c,i)=>({...c,id:Date.now()+i}));
let catColors=read(CKEY,isObj,{}),catIcons=read(IKEY,isObj,{}),catOrder=read(OKEY,Array.isArray,[]);
let curCat='Daily life',filter='Priority',cats=[],shown=[],idx=0;
const persist=()=>write(KEY,cards);
const persistCats=()=>{write(OKEY,catOrder);write(IKEY,catIcons);write(CKEY,catColors)};
const allCats=()=>{
  const nat=[...new Set(cards.map(c=>c.cat).filter(Boolean))],has=new Set(nat);
  const known=[...new Set(catOrder)].filter(c=>has.has(c)),ks=new Set(known);
  return[...known,...nat.filter(c=>!ks.has(c))];
};
const okImg=v=>typeof v==='string'&&/^data:image\/[^"<>]*$/.test(v);
const imgTag=(cls,src)=>okImg(src)?`<img${cls?` class="${cls}"`:''} src="${src}" alt="">`:'';
const catColor=n=>{n=String(n||'');if(isHex(catColors[n]))return catColors[n];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const chipsHtml=()=>['All',...cats].map(c=>`<button class="${c==='All'?'all ':''}${c===filter?'sel':''}" style="${c==='All'?'':`background:${catColor(c)};color:#1d1d1b`}" data-f="${esc(c)}">${imgTag('cic',catIcons[c])}${esc(c)}</button>`).join('');
// Drawn glasses for the drink cards
const gl=inner=>'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">'+inner+'</svg>');
const OUT='fill="none" stroke="#5b6b7b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const tumbler=(fill,extra,top)=>`<path d="M25.5 ${top||38} L74.5 ${top||38} L70 107 Q70 109 68 109 L32 109 Q30 109 30 107 Z" fill="${fill}"/>${extra||''}<path d="M22 22 L78 22 L72 108 Q72 112 68 112 L32 112 Q28 112 28 108 Z" ${OUT}/><path d="M32 30 L35 100" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>`;

// Add a built-in set of cards once per device (never twice, never duplicates)
function seedOnce(flag,list,cat,off){
  try{if(localStorage.getItem(flag))return false}catch(e){return false}
  const have=new Set(cards.map(c=>String(c.en).toLowerCase()));
  list.forEach((d,i)=>{if(!have.has(d.en.toLowerCase()))cards.push({id:Date.now()+off+i,...d,cat})});
  try{localStorage.setItem(flag,'1')}catch(e){}
  persist();return true;
}

// One-finger swipes: accept(e) decides at touchstart, cb(dx,dy) runs at touchend
function swipes(el,accept,cb){
  let x=0,y=0,on=false;
  el.addEventListener('touchstart',e=>{on=e.touches.length===1&&accept(e);if(on){x=e.touches[0].clientX;y=e.touches[0].clientY}},{passive:true});
  el.addEventListener('touchend',e=>{if(!on)return;on=false;cb(e.changedTouches[0].clientX-x,e.changedTouches[0].clientY-y)},{passive:true});
}

});

// ---------- Add a card (translates English -> Chinese; asks her to type it if that fails) ----------
const msg=t=>$('tst').textContent=t||'';
async function translate(q){
  if(!navigator.onLine)return null;
  const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),8000);
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=en|zh-CN',{signal:ac.signal});
    const t=((await r.json()).responseData||{}).translatedText;
    return !t||/MYMEMORY|INVALID|QUERY LENGTH/i.test(t)?null:t;
  }catch(e){return null}finally{clearTimeout(timer)}
}

$('save').onclick=async()=>{

  let zh=await translate(en);
  if(!zh)zh=(prompt('Could not translate (offline?). Type the Chinese for this card:')||'').trim();

function pickImage(max,cb){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL(f.type==='image/jpeg'?'image/jpeg':'image/png',.85))};
      im.onerror=()=>alert('That picture could not be opened.');im.src=r.result};
    r.readAsDataURL(f)};
  i.click();
}

function openCatDel(cat){

// Save everything that changed, close the dialog and redraw
const commit=withCats=>{if(withCats)persistCats();persist();closeDlg();render()};
const forgetCat=c=>{delete catColors[c];delete catIcons[c];catOrder=catOrder.filter(x=>x!==c)};
function saveCategory(){
  const nn=$('cn').value.trim(),old=dctx.cat;if(!nn)return;
  const p=readPos();
  if(p!==dctx.pos0||catOrder.length){
    let order=allCats();const merge=nn!==old&&order.includes(nn);
    order=order.filter(c=>c!==old);if(!merge)order.splice(Math.min(p-1,order.length),0,nn);
    catOrder=order;
  }
  if(nn!==old){
    const exists=allCats().includes(nn);
    cards.forEach(c=>{if(c.cat===old)c.cat=nn});
    if(!exists)catColors[nn]=dctx.color;
    delete catColors[old];
    if(curCat===old)curCat=nn;
    delete catIcons[old];
  }else catColors[old]=dctx.color;
  if(dctx.icon)catIcons[nn]=dctx.icon;else if(nn===old)delete catIcons[nn];
  filter=nn;commit(true);
}
function saveCard(){
  const c=cards.find(x=>x.id===dctx.id);
  const cat=$('dc').value==='__new__'?$('dn').value.trim():$('dc').value;
  const en=$('de').value.trim(),zh=$('dz').value.trim();
  if(!cat||!en||!zh)return;
  if(c){Object.assign(c,{cat,en,zh});setOpt(c,'img',dctx.img);setOpt(c,'logo',dctx.logo)}
  curCat=cat;commit(false);
}
function deleteCard(){if(confirm('Delete this card?')){cards=cards.filter(x=>x.id!==dctx.id);commit(false)}}
function moveCards(){
  const to=$('dm').value,from=dctx.cat;
  cards.forEach(c=>{if(c.cat===from)c.cat=to});
  if(curCat===from)curCat=to;filter='All';forgetCat(from);commit(true);
}
function deleteCategory(){
  const from=dctx.cat,n=cards.filter(c=>c.cat===from).length;
  if(!confirm(`Delete “${from}” and its ${n} card${n===1?'':'s'}? This cannot be undone.`))return;
  cards=cards.filter(c=>c.cat!==from);if(curCat===from)curCat='Daily life';filter='All';forgetCat(from);commit(true);
}

const libColor=(cat,idx)=>isHex(catColors[cat])||cards.some(c=>c.cat===cat)?catColor(cat):PAL[idx%PAL.length];
const normEn=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
// All sentences of a pack, most used first within each category. t = tier: 1 Small, 2 Medium, 3 Large
function libItems(p){
  if(!p._items){let u=0;p._items=p.groups.flatMap(([cat,...tiers],g)=>tiers.flatMap((list,k)=>list.map(([en,zh])=>({uid:u++,en,zh,cat,g,t:k+1,k:(en+' '+zh+' '+cat).toLowerCase().replace(/[’']/g,'')}))))}
  return p._items;
}
let libPack=null,libList=[],libSize=1,libQuery='',lpUid=null;const libSel=new Set(),libCol=new Set();

function libHome(){
  libPack=null;const have=new Set(cards.map(c=>normEn(c.en)));

    +LIBRARY.map(p=>{const all=libItems(p),n=all.filter(c=>have.has(normEn(c.en))).length;
      return `<button class="skopt" data-a="lib-open" data-id="${p.id}"><span class="skpv libtile">${esc(p.tile)}</span><span><b>${esc(p.name)}</b><small>${esc(p.desc)}<br>${n} of ${all.length} already in your collection</small></span></button>`}).join('')

}

function libOpen(id){libPack=LIBRARY.find(p=>p.id===id);if(!libPack)return;libSize=1;libQuery='';libSel.clear();libCol.clear();libPack.groups.forEach((_,g)=>libCol.add(g));libDraw('')}

function libCompute(){

function libDraw(message){

// While typing only the list is redrawn, so the search box keeps its focus
function libRefresh(){libCompute();$('lbody').innerHTML=libBodyHtml();$('lqx').hidden=!libQuery;$('dbox').scrollTop=0;libColSync();libSync()}
function libQClear(){libQuery='';$('lq').value='';libRefresh();$('lq').focus()}

// Refresh the counters, the tick boxes of the categories and the Add button
function libSync(message){
  libPack.groups.forEach(([cat],g)=>{
    const box=$('dbox').querySelector(`[data-lc="${g}"]`);if(!box)return;
    const rows=libList.filter(c=>c.g===g&&!c.have),sel=rows.filter(c=>libSel.has(c.uid)).length;
    box.disabled=!rows.length;box.checked=!!rows.length&&sel===rows.length;box.indeterminate=sel>0&&sel<rows.length;
    $('dbox').querySelector(`[data-lcount="${g}"]`).textContent=rows.length?`${sel} / ${rows.length}`:'all added ✓';
  });
  const n=libSel.size;$('ladd').textContent=n?`Add ${n} card${n===1?'':'s'} to my collection`:'Tick cards to add';$('ladd').disabled=!n;
  const vis=new Set(libList.map(c=>c.uid)),hid=[...libSel].filter(u=>!vis.has(u)).length;
  $('lmsg').textContent=message||(hid?`${hid} ticked card${hid===1?'':'s'} hidden by this search`:'');
}

function libSetFold(g,col){
  const box=$('dbox'),grp=box.querySelector(`[data-grp="${g}"]`),hd=box.querySelector(`.lhd[data-g="${g}"]`);
  if(col)libCol.add(g);else libCol.delete(g);

const libShownGroups=()=>[...$('dbox').querySelectorAll('[data-grp]')].map(d=>+d.dataset.grp);

function libColSync(){const b=$('lcol');if(b)b.textContent=[...$('dbox').querySelectorAll('[data-grp]')].every(d=>d.hidden)?'Expand all':'Collapse all'}
function libAll(){libList.forEach(c=>{if(!c.have)libSel.add(c.uid)});$('dbox').querySelectorAll('[data-li]:not(:disabled)').forEach(b=>b.checked=true);libSync()}

// Put sentences into the collection (used by the Add button and by the preview)
function libAddItems(items){
  const had=new Set(cards.map(c=>c.cat)),used=new Set(cards.map(c=>c.id));let id=Date.now();
  items.forEach(c=>{while(used.has(id))id++;used.add(id);cards.push({id,en:c.en,zh:c.zh,cat:c.cat})});
  const added=[...new Set(items.map(c=>c.cat))];
  added.forEach(cat=>{if(!had.has(cat))catColors[cat]=PAL[libPack.groups.findIndex(g=>g[0]===cat)%PAL.length]});
  persistCats();persist();filter=added[0];render();return added;
}
function libAdd(){
  const have=new Set(cards.map(c=>normEn(c.en))),picked=libItems(libPack).filter(c=>libSel.has(c.uid)&&!have.has(normEn(c.en)));if(!picked.length)return;
  const added=libAddItems(picked);libSel.clear();
  libDraw(`✓ ${picked.length} card${picked.length===1?'':'s'} added${added.length>1?' in '+added.length+' categories':' to “'+added[0]+'”'}. Close to see them.`);
}

// ---------- Add bar at the bottom (Sticker pop): while typing, the page scrolls inside the visible screen (above the keyboard), the title and buttons stay pinned on top and the bar sits right above the keyboard ----------
const vv=window.visualViewport,formEl=document.querySelector('.form'),mainEl=document.querySelector('main');
let composing=false,savedY=0,compT;
function syncVV(){if(!composing||!vv)return;const b=document.body.style;b.top=vv.offsetTop+'px';b.height=vv.height+'px'}
function setCompose(on){
  if(on===composing)return;composing=on;
  if(on){savedY=window.scrollY;document.documentElement.classList.add('composing');syncVV();mainEl.scrollTop=savedY}
  else{const y=mainEl.scrollTop;document.documentElement.classList.remove('composing');document.body.style.top=document.body.style.height='';scrollTo(0,y)}
}
if(vv){vv.addEventListener('resize',syncVV);vv.addEventListener('scroll',syncVV)}
formEl.addEventListener('focusin',()=>{clearTimeout(compT);if(curSkin()==='sticker')setCompose(true)});
formEl.addEventListener('focusout',()=>{clearTimeout(compT);compT=setTimeout(()=>{if(!formEl.contains(document.activeElement))setCompose(false)},200)});

// ---------- Export / import (one JSON file; date and time in the file name) ----------
$('exp').onclick=()=>{
  const d=new Date(),z=n=>String(n).padStart(2,'0'),cs=allCats();
  const stamp=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}`;
  const data={app:APP.name,version:APP.ver,exported:d.toISOString(),cards,categories:cs,colors:Object.fromEntries(cs.map(c=>[c,catColor(c)])),icons:catIcons,order:cs};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download=`rebecca-flashcards_${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.cards;
    if(!Array.isArray(arr))throw 0;
    const have=new Map(cards.map(c=>[c.en+'|'+c.zh,c]));let add=0,skip=0,upd=0;
    arr.forEach((c,k)=>{
      if(!c||typeof c.en!=='string'||typeof c.zh!=='string'){skip++;return}
      const key=c.en+'|'+c.zh;
      if(have.has(key)){const ex=have.get(key);if(typeof c.cat==='string'&&c.cat)ex.cat=c.cat;if(okImg(c.img))ex.img=c.img;if(okImg(c.logo))ex.logo=c.logo;upd++;return}
      const nc={id:Date.now()+k,en:c.en,zh:c.zh,cat:c.cat||'Daily life'};if(okImg(c.img))nc.img=c.img;if(okImg(c.logo))nc.logo=c.logo;cards.push(nc);have.set(key,nc);add++;
    });
    if(isObj(j.colors))for(const k in j.colors)if(isHex(j.colors[k]))catColors[k]=j.colors[k];
    if(isObj(j.icons))for(const k in j.icons)if(okImg(j.icons[k]))catIcons[k]=j.icons[k];
    if(Array.isArray(j.order)){const o=j.order.filter(x=>typeof x==='string');catOrder=[...new Set([...o,...catOrder])]}
    persistCats();persist();render();alert(add+' cards imported, '+upd+' updated (category, pictures), '+skip+' skipped.');
  }catch(err){alert('This file could not be imported.')}
};

// ---------- Hold and drag a card to reorder ----------
$('list').addEventListener('contextmenu',e=>e.preventDefault());
$('list').addEventListener('pointerdown',e=>{
  const c=e.target.closest('.card');if(!c||e.target.dataset.e)return;
  sx0=e.clientX;sy0=e.clientY;clearTimeout(lp);
  lp=setTimeout(()=>{dr=c;c.classList.add('drag');if(navigator.vibrate)navigator.vibrate(30)},400);
});
$('list').addEventListener('pointermove',e=>{
  if(!dr){if(Math.hypot(e.clientX-sx0,e.clientY-sy0)>10)clearTimeout(lp);return}
  dr.style.transform=`translate(${e.clientX-sx0}px,${e.clientY-sy0}px)`;
  if(tgt)tgt.classList.remove('tb','ta');
  tgt=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('card')&&x!==dr)||null;
  if(tgt){const r=tgt.getBoundingClientRect();after=e.clientX>r.left+r.width/2;tgt.classList.add(after?'ta':'tb')}
  if(e.clientY<90)scrollBy(0,-12);else if(e.clientY>innerHeight-90)scrollBy(0,12);
});
$('list').addEventListener('touchmove',e=>{if(dr){mDrag=true;e.preventDefault()}},{passive:false});
function endDrag(drop){
  clearTimeout(lp);if(!dr)return;
  const c=dr,t=tgt;dr=null;tgt=null;justDragged=true;setTimeout(()=>justDragged=false,60);
  if(drop&&t){
    const item=shown[+c.dataset.i],arr=shown.filter(x=>x!==item);
    let pos=arr.indexOf(shown[+t.dataset.i]);if(after)pos++;arr.splice(pos,0,item);
    const slots=[];cards.forEach((x,k)=>{if(shown.includes(x))slots.push(k)});
    slots.forEach((k,j)=>cards[k]=arr[j]);persist();
  }
  render();
}
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));

// ---------- Card viewer ----------
let vcard=null;
function openView(i){
  idx=i;drawVChips();show();$('view').classList.add('open');
}
function drawVChips(){$('vchips').innerHTML=chipsHtml()}
function refreshView(){
  if(!viewOpen())return;
  if(!shown.length)return closeView();
  drawVChips();
  const k=shown.findIndex(x=>x.id===vcard);
  idx=k>=0?k:Math.min(idx,shown.length-1);show();
}
function show(){
  const c=shown[idx],pic=okImg(c.img),n=[...c.zh].length;vcard=c.id;
  $('vimg').className=pic?'on':'';$('vimg').innerHTML=pic?imgTag('cimg',c.img)+imgTag('clg',c.logo):'';
  $('vzh').textContent=c.zh;$('vzh').style.fontSize=n<=8?'':n<=16?'min(12vw,80px)':'min(7.5vw,46px)';
  $('ven').textContent=c.en;$('cno').textContent=(idx+1)+' / '+shown.length;
}
function step(n){idx=(idx+n+shown.length)%shown.length;show()}
function closeView(){$('view').classList.remove('open')}
$('vchips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render();idx=0;show()}};
$('close').onclick=closeView;
$('vedit').onclick=()=>{const c=shown[idx];if(c)openEdit(c.id)};
$('say').onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(shown[idx].zh);u.lang='zh-CN';speechSynthesis.speak(u)}catch(e){}};
// Tap the text on a card to hear it: Chinese in Chinese, English in English
const speak=(t,l)=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l;speechSynthesis.speak(u)}catch(e){}};
$('vzh').onclick=()=>{const c=shown[idx];if(c)speak(c.zh,'zh-CN')};
$('ven').onclick=()=>{const c=shown[idx];if(c)speak(c.en,'en-GB')};
document.addEventListener('keydown',e=>{
  if(!viewOpen()||$('dlg').classList.contains('open'))return;
  if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')closeView();
});
// Card view: swipe left/right = next/previous card, up = close, down = next category
swipes($('view'),e=>!e.target.closest('.top,#dlg'),(dx,dy)=>{
  if(Math.abs(dy)>70&&Math.abs(dy)>Math.abs(dx)*1.5){if(dy<0)closeView();else{cycleFilter(1);idx=0;show()}}
  else if(Math.abs(dx)>50)step(dx<0?1:-1);
});

$('appname').innerHTML='<span class="logo">📇</span> '+esc(APP.name);$('byline').textContent="by BuulSoft '26";$('ver').textContent='v'+APP.ver;
$('bn').textContent=APP.name;$('bv').textContent='v'+APP.ver;document.title=`${APP.name} by BuulSoft '26 - v${APP.ver}`;

let splashTimer;
function openSplash(auto){$('splash').classList.add('open');clearTimeout(splashTimer);runSplashDemo(auto);if(auto)splashTimer=setTimeout(closeSplash,15000)}
function closeSplash(){clearTimeout(splashTimer);demoId++;$('splash').classList.remove('open')}

// ---------- Splash intro: after 2 s a small overlay types a phrase, saves it and files it in the People stack ----------
// Only the splash is animated; her real cards are never touched. Tap anywhere to skip.
const BAT='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 56"><path fill="#161616" d="M50 8 L55 17 Q61 15 67 19 Q79 9 97 15 Q89 24 91 35 Q83 31 77 37 Q73 30 66 36 Q60 32 56 44 L50 52 L44 44 Q40 32 34 36 Q27 30 23 37 Q17 31 9 35 Q11 24 3 15 Q21 9 33 19 Q39 15 45 17 Z"/></svg>');
const TOP={Priority:'<b class="pz">你好</b>',Drinks:`<img class="plg" src="${BAT}" alt=""><span class="pw">BACARDÍ</span>`,People:''};
let demoId=0;
async function runSplashDemo(auto){
  const id=++demoId,wait=ms=>new Promise((res,rej)=>setTimeout(()=>id===demoId?res():rej('x'),ms));
  const dm=$('sdm'),T=$('dmt'),SV=$('dmsave'),SEL=$('dmsel'),ST=$('dmst'),C=$('dmcard'),EN=$('dmen'),ZH=$('dmzh'),NAMES=['Priority','Drinks','People'];
  const TXT='Hello, how are you',CN='你好，你好吗？',count=n=>cards.filter(c=>c.cat===n).length;
  dm.classList.remove('on');SV.classList.remove('on','press');SEL.classList.remove('hl');
  T.textContent=EN.textContent=ZH.textContent='';$('dmsv').textContent='Category';
  C.className='dmcard';C.style.cssText='';C.style.background=catColor('People');
  ST.innerHTML=NAMES.map(n=>`<div class="stk" data-n="${n}"><div class="pile"><div class="pc" style="background:${catColor(n)}"></div><div class="pc" style="background:${catColor(n)}"></div><div class="pc" style="background:${catColor(n)}">${TOP[n]}</div></div><span>${n}</span> · <span class="cn">${count(n)}</span></div>`).join('');
  try{
    await wait(2000);
    dm.classList.add('on');await wait(450);
    for(let i=1;i<=TXT.length;i++){
      T.textContent=EN.textContent=TXT.slice(0,i);
      ZH.textContent=CN.slice(0,Math.ceil(i*CN.length/TXT.length));
      if(i===1)SV.classList.add('on');
      await wait(40);
    }
    await wait(250);
    $('dmsv').textContent='People';SEL.classList.add('hl');await wait(500);
    SV.classList.add('press');await wait(180);SV.classList.remove('press');
    T.textContent='';SV.classList.remove('on');await wait(200);
    const pile=ST.querySelector('[data-n="People"] .pile'),a=C.getBoundingClientRect(),b=pile.getBoundingClientRect();
    C.style.transition='transform .6s ease-in-out,opacity .25s .4s';
    C.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.35)`;
    C.style.opacity=0;
    await wait(620);
    const stk=ST.querySelector('[data-n="People"]');stk.classList.add('bump');stk.querySelector('.cn').textContent=count('People')+1;
    await wait(1000);
    if(auto)closeSplash();
  }catch(e){}
}
$('splash').onclick=closeSplash;$('title').onclick=()=>openSplash(false);
openSplash(true);
render();
